name: Arch repository

# Builds the pacman package in an Arch container, folds it into the published
# repository, and deploys the result to GitHub Pages.
#
# Pages is configured with "Source: GitHub Actions", so the site is deployed by
# deploy-pages — nothing is served from a gh-pages branch. Package history has
# to live somewhere, otherwise every deployment would replace the repository
# with a single version; the `repo-data` branch is that storage and is never
# served directly.
#
# Users then get updates through `pacman -Syu`:
#
#   [lumo]
#   SigLevel = Required DatabaseOptional
#   Server = https://nichu42.github.io/lumo-desktop/arch/x86_64
#
# Signing is optional: with the PACMAN_GPG_KEY secret the package and database
# are signed and `SigLevel = Required` works. Without it the repository is
# unsigned and users need `SigLevel = Optional TrustAll` — see PACKAGING.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arch-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install base tooling
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Install the recipe's dependencies
        run: |
          set -euo pipefail
          # Derive the list from the committed .SRCINFO so the workflow cannot
          # drift from the PKGBUILD. makepkg itself cannot be called here: it
          # refuses to run as root, and this step runs before the builder user
          # exists. The build step re-generates .SRCINFO and fails on a diff.
          deps=$(awk -F' = ' '/^[[:space:]]*(make)?depends = /{print $2}' \
            packaging/arch/.SRCINFO | tr '\n' ' ')
          echo "installing: $deps"
          pacman -S --noconfirm --needed $deps

      - name: The two NOTICE copies must not drift
        run: cmp NOTICE packaging/arch/NOTICE

      - name: Build the package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root; dependencies are already installed
          # above, so --nodeps is safe here.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && \
            makepkg --printsrcinfo > /tmp/expected.SRCINFO && \
            diff -u .SRCINFO /tmp/expected.SRCINFO && \
            makepkg --noconfirm --nodeps"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    container:
      # repo-add and pacman keyring tooling only exist in an Arch environment.
      image: archlinux:base-devel
    env:
      # Job-level so the step-level `if` below can test it: the secrets context
      # is not reliable inside `if` expressions.
      PACMAN_GPG_KEY: ${{ secrets.PACMAN_GPG_KEY }}
      GPG_KEY_ID: ${{ secrets.PACMAN_GPG_KEY_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install publishing tooling
        run: pacman -Syu --noconfirm --needed git gnupg

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: pkgs

      - name: Import signing key
        if: env.PACMAN_GPG_KEY != ''
        run: |
          set -euo pipefail
          # Accept either the armoured private key or its base64 form, so the
          # same value that already exists for the Wire Flatpak repo can be
          # pasted in unchanged.
          case "$PACMAN_GPG_KEY" in
            *"BEGIN PGP PRIVATE KEY"*) printf '%s' "$PACMAN_GPG_KEY" | gpg --batch --import ;;
            *) printf '%s' "$PACMAN_GPG_KEY" | base64 -d | gpg --batch --import ;;
          esac
          gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print "imported key id: " $5}'

      - name: Restore the published repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" repo-data >/dev/null 2>&1; then
            git clone --depth=1 --branch repo-data "$remote" site
          else
            mkdir -p site
            git -C site init -q -b repo-data
            git -C site remote add origin "$remote"
          fi

      - name: Add the package to the repository
        run: |
          set -euo pipefail
          mkdir -p site/arch/x86_64
          cp pkgs/*.pkg.tar.zst site/arch/x86_64/
          # Notices travel with the repository, not only inside the package.
          cp LICENSE NOTICE site/arch/x86_64/

          cd site/arch/x86_64
          # Split packages this recipe no longer produces (an older -debug
          # build) must not linger: a package file and its database entry are
          # two separate things, and pruning only one leaves the repo
          # advertising a download that is gone.
          rm -f ./*-debug-*.pkg.tar.zst

          # Rebuild the database from the package files that are actually
          # present. repo-add is incremental, so a stale entry would survive
          # forever otherwise; a rebuild keeps files and database in lockstep.
          # Note repo-add keeps ONE entry per package name (it replaces an
          # older version), so earlier files stay on disk for a manual
          # `pacman -U` but are not offered by the repository.
          rm -f lumo.db* lumo.files*

          if [ -n "${GPG_KEY_ID:-}" ]; then
            repo-add --sign --key "$GPG_KEY_ID" lumo.db.tar.gz ./*.pkg.tar.zst
            gpg --export --armor "$GPG_KEY_ID" > lumo.gpg
          else
            echo "::warning::PACMAN_GPG_KEY not configured — publishing an UNSIGNED repository"
            repo-add lumo.db.tar.gz ./*.pkg.tar.zst
          fi
          ls -la

      - name: Commit the repository state
        run: |
          set -euo pipefail
          cd site
          git add -A
          git commit -q -m "repo: $(basename "$(ls ../pkgs/*.pkg.tar.zst | head -1)")"
          git push origin repo-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
